<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Depth of Field Simulator</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #0076ff;
            --text: #333333;
            --border: #e0e0e0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            color: #111;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .visualizer-box {
            position: relative;
            width: 100%;
            height: 220px;
            background: #eef2f7;
            border-radius: 8px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .scene-element {
            position: absolute;
            bottom: 25px;
            text-align: center;
            transition: left 0.2s ease, filter 0.1s linear;
        }

        .camera { left: 4%; font-size: 40px; }
        .subject { font-size: 50px; z-index: 5; }
        .backdrop { right: 4%; font-size: 60px; }

        .dof-zone {
            position: absolute;
            bottom: 20px;
            height: 65px;
            background: rgba(0, 118, 255, 0.12);
            border-left: 2px dashed var(--primary);
            border-right: 2px dashed var(--primary);
            border-radius: 4px;
            pointer-events: none;
            transition: left 0.2s ease, width 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--primary);
            font-weight: bold;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 6px;
        }

        label span { font-weight: normal; color: #666; }

        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            box-sizing: border-box;
        }

        input[type="range"] { padding: 0; margin: 8px 0; }

        .outputs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .output-card {
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .output-card div:first-child {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .output-card div:last-child {
            font-size: 16px;
            font-weight: bold;
            color: #111;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .config-grid, .outputs { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Advanced Depth of Field Simulator</h2>
    
    <!-- Visual Engine Screen -->
    <div class="visualizer-box">
        <div class="scene-element camera">📷<br><span style="font-size:10px;">Camera</span></div>
        <div id="visual-subject" class="scene-element subject">👶<br><span style="font-size:10px;">Subject</span></div>
        <div id="visual-backdrop" class="scene-element backdrop">🖼️<br><span style="font-size:10px;">Backdrop</span></div>
        <div id="visual-dof" class="dof-zone">Sharp Zone</div>
    </div>

    <!-- Hardware Configuration Profiles -->
    <div class="config-grid">
        <div class="control-group">
            <label>Sensor Format</label>
            <select id="sensor-type">
                <option value="0.019" selected>APS-C / Crop (Canon R10 default)</option>
                <option value="0.030">Full Frame (Canon R3, R5, R6)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Lens Profile Presets</label>
            <select id="lens-profile">
                <option value="50,1.8" selected>RF 50mm f/1.8 STM (Your Lens)</option>
                <option value="85,2.0">RF 85mm f/2.0 Macro IS STM</option>
                <option value="35,1.8">RF 35mm f/1.8 Macro IS STM</option>
                <option value="24,1.8">RF 24mm f/1.8 Macro IS STM</option>
                <option value="70,2.8">RF 70-200mm f/2.8L IS USM (Telephoto)</option>
            </select>
        </div>
    </div>

    <!-- Interface Sliders Parameters -->
    <div class="control-group">
        <label>Aperture: <span id="aperture-val">f/2.8</span></label>
        <input type="range" id="aperture" min="1.4" max="16" step="0.1" value="2.8">
    </div>

    <div class="control-group">
        <label>Focal Length: <span id="focal-val">50 mm</span></label>
        <input type="range" id="focal" min="16" max="200" step="1" value="50">
    </div>

    <div class="control-group">
        <label>Subject Distance: <span id="distance-val">2.5 m</span></label>
        <input type="range" id="distance" min="0.5" max="10" step="0.1" value="2.5">
    </div>

    <!-- Math Metrics Matrix -->
    <div class="outputs">
        <div class="output-card">
            <div>Hyperfocal</div>
            <div id="out-hyperfocal">-</div>
        </div>
        <div class="output-card">
            <div>Near Limit</div>
            <div id="out-near">-</div>
        </div>
        <div class="output-card">
            <div>Far Limit</div>
            <div id="out-far">-</div>
        </div>
        <div class="output-card">
            <div>Total DoF</div>
            <div id="out-total-dof">-</div>
        </div>
    </div>
</div>

<script>
    const BACKDROP_DISTANCE = 5.0; // Simulated backdrop positioned at 5.0 meters

    const sensorSelect = document.getElementById('sensor-type');
    const lensSelect = document.getElementById('lens-profile');
    const apertureInput = document.getElementById('aperture');
    const focalInput = document.getElementById('focal');
    const distanceInput = document.getElementById('distance');

    // Profile listener to swap sliders intelligently based on selected lens physical limitations
    lensSelect.addEventListener('change', () => {
        const [focal, minAperture] = lensSelect.value.split(',').map(Number);
        focalInput.value = focal;
        apertureInput.min = minAperture;
        if (parseFloat(apertureInput.value) < minAperture) {
            apertureInput.value = minAperture;
        }
        calculateDoF();
    });

    sensorSelect.addEventListener('change', calculateDoF);

    function calculateDoF() {
        const COC = parseFloat(sensorSelect.value); // Selects 0.019 (Canon APS-C) or 0.030 (Full Frame)
        const N = parseFloat(apertureInput.value);
        const f = parseFloat(focalInput.value);
        const s = parseFloat(distanceInput.value) * 1000; // Convert meters to mm

        // Synchronize display text labels
        document.getElementById('aperture-val').innerText = `f/${N.toFixed(1)}`;
        document.getElementById('focal-val').innerText = `${f} mm`;
        document.getElementById('distance-val').innerText = `${(s/1000).toFixed(1)} m`;

        // Calculate optical equations properties
        const hyperfocal = (f * f) / (N * COC) + f; 
        const nearLimit = ((hyperfocal - f) * s) / (hyperfocal + s - (2 * f));
        let farLimit = ((hyperfocal - f) * s) / (hyperfocal - s);

        let totalDof = farLimit - nearLimit;
        if (farLimit < 0 || farLimit > 100000) {
            farLimit = Infinity;
            totalDof = Infinity;
        }

        // Print calculated metric readings
        document.getElementById('out-hyperfocal').innerText = `${(hyperfocal / 1000).toFixed(2)} m`;
        document.getElementById('out-near').innerText = `${(nearLimit / 1000).toFixed(2)} m`;
        document.getElementById('out-far').innerText = farLimit === Infinity ? 'Infinity' : `${(farLimit / 1000).toFixed(2)} m`;
        
        if (totalDof === Infinity) {
            document.getElementById('out-total-dof').innerText = 'Infinite';
        } else if (totalDof >= 1000) {
            document.getElementById('out-total-dof').innerText = `${(totalDof / 1000).toFixed(2)} m`;
        } else {
            document.getElementById('out-total-dof').innerText = `${(totalDof / 10).toFixed(1)} cm`;
        }

        // Graphical layout scaling engine updates (translates 0m - 6m range to CSS horizontal percentages)
        const subject = document.getElementById('visual-subject');
        const backdrop = document.getElementById('visual-backdrop');
        const dofZone = document.getElementById('visual-dof');

        const subjectLeft = 4 + ((s / 1000) / 6) * 75;
        subject.style.left = `${subjectLeft}%`;
        
        const backdropLeft = 4 + (BACKDROP_DISTANCE / 6) * 75;
